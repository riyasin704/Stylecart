<!DOCTYPE html>
<html>
<head>
    <title>StyleCart - Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f6f3f0;
            color: #333;
        }

        .navbar {
            background-color: #222;
            padding: 18px 30px;
            text-align: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 0 14px;
            font-size: 15px;
        }

        .navbar a:hover {
            color: #e8b07a;
        }

        .container {
            width: 90%;
            max-width: 450px;
            margin: 60px auto;
        }

        .login-box {
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .page-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-heading h1 {
            color: #222;
            margin-bottom: 8px;
        }

        .page-heading p {
            color: #777;
            margin: 0;
        }

        .error {
            background-color: #f8e2e2;
            color: #a33;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #888;
        }

        .login-button {
            width: 100%;
            background-color: #222;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .login-button:hover {
            background-color: #444;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: #666;
        }

        .register-link a {
            color: #555;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            color: #a06b42;
            text-decoration: underline;
        }

        @media (max-width: 600px) {

            .navbar a {
                display: inline-block;
                margin: 7px 8px;
            }

            .login-box {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">

        <a href="{% url 'home' %}">Home</a>

        <a href="{% url 'product_list' %}">Products</a>

        <a href="{% url 'category_list' %}">Categories</a>

        <a href="{% url 'cart' %}">My Cart</a>

        <a href="{% url 'register' %}">Register</a>

    </div>


    <div class="container">

        <div class="login-box">

            <div class="page-heading">

                <h1>Login</h1>

                <p>Login to your StyleCart account.</p>

            </div>


            {% if error %}

                <div class="error">
                    {{ error }}
                </div>

            {% endif %}


            <form method="POST">

                {% csrf_token %}


                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        required
                    >

                </div>


                <button
                    class="login-button"
                    type="submit"
                >
                    Login
                </button>

            </form>


            <div class="register-link">

                Don't have an account?
                <a href="{% url 'register' %}">
                    Register
                </a>

            </div>

        </div>

    </div>

</body>
</html>
