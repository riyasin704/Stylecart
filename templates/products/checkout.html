<!DOCTYPE html>
<html>
<head>
    <title>StyleCart - Checkout</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f6f3f0;
            color: #333;
        }

        .navbar {
            background-color: #222;
            padding: 18px 30px;
            text-align: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 0 14px;
            font-size: 15px;
        }

        .navbar a:hover {
            color: #e8b07a;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 50px auto;
        }

        .checkout-box {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .page-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-heading h1 {
            color: #222;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .page-heading p {
            color: #777;
            margin: 0;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 7px;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #888;
        }

        textarea {
            height: 110px;
            resize: vertical;
        }

        .place-order {
            width: 100%;
            background-color: #222;
            color: white;
            border: none;
            padding: 13px;
            margin-top: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .place-order:hover {
            background-color: #444;
        }

        .back-links {
            text-align: center;
            margin-top: 28px;
        }

        .back-links a {
            color: #555;
            text-decoration: none;
            margin: 0 10px;
        }

        .back-links a:hover {
            color: #a06b42;
            text-decoration: underline;
        }

        @media (max-width: 600px) {

            .navbar a {
                display: inline-block;
                margin: 7px 8px;
            }

            .checkout-box {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">

        <a href="{% url 'home' %}">Home</a>

        <a href="{% url 'product_list' %}">Products</a>

        <a href="{% url 'category_list' %}">Categories</a>

        <a href="{% url 'cart' %}">My Cart</a>

        {% if request.session.customer_id %}

            <a href="{% url 'my_orders' %}">My Orders</a>

            <a href="{% url 'logout' %}">Logout</a>

        {% else %}

            <a href="{% url 'login' %}">Login</a>

            <a href="{% url 'register' %}">Register</a>

        {% endif %}

    </div>


    <div class="container">

        <div class="checkout-box">

            <div class="page-heading">

                <h1>Checkout</h1>

                <p>
                    Enter your delivery details to place your order.
                </p>

            </div>


            <form method="POST">

                {% csrf_token %}


                <div class="form-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        name="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Address</label>

                    <textarea
                        name="address"
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label>Phone Number</label>

                    <input
                        type="text"
                        name="phone"
                        required
                    >

                </div>


                <button
                    class="place-order"
                    type="submit"
                >
                    Place Order
                </button>

            </form>


            <div class="back-links">

                <a href="{% url 'cart' %}">
                    ← Back to Cart
                </a>

            </div>

        </div>

    </div>

</body>
</html>
