<!DOCTYPE html>
<html>
<head>
    <title>StyleCart - Admin Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f6f3f0;
            color: #333;
        }

        .login-box {
            width: 90%;
            max-width: 420px;
            margin: 80px auto;
            padding: 35px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
        }

        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading h1 {
            margin: 0 0 8px;
            color: #222;
            font-size: 30px;
        }

        .heading p {
            margin: 0;
            color: #777;
        }

        .error {
            background-color: #f8e2e2;
            color: #a33;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #888;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 5px;
            background-color: #222;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #444;
        }

        .back-link {
            text-align: center;
            margin-top: 25px;
        }

        .back-link a {
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link a:hover {
            color: #a06b42;
            text-decoration: underline;
        }

        @media (max-width: 500px) {

            .login-box {
                margin: 50px auto;
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="heading">

            <h1>StyleCart</h1>

            <p>Admin Login</p>

        </div>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter admin email"
                    required
                >

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button type="submit">
                Login
            </button>

        </form>


        <div class="back-link">

            <a href="{% url 'home' %}">
                ← Back to StyleCart
            </a>

        </div>

    </div>

</body>
</html>
